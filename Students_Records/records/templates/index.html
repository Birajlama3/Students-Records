{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    {% include 'navbar.html' %}
    <h1>Student Records</h1>

    <table border="1">

        <tr>
            <th>Name</th>
            <th>Stack</th>
            <th>Title</th>
            <th>Task Done</th>
            <th>Date</th>
            <th>Hours Worked</th>
            <th>Action</th>
        </tr>

        {% for x in myrecords %}
        <tr>
            <td>{{ x.name }}</td>
            <td>{{ x.stack }}</td>
            <td>{{ x.title }}</td>
            <td>{{ x.description }}</td>
            <td>{{ x.date }}</td>
            <td>{{ x.hours_worked }}</td>
            <td>
            <a href="{% url 'edit_task' x.id %}">Edit</a>

            <form action="{% url 'delete_task' x.id %}" method="POST" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>
            </td>
        </tr>
        {% endfor %}

    </table>
    <button><a href="{% url 'add_task' %}">Add new records</a></button>
</body>
</html>
