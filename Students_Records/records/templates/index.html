{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    {% include 'navbar.html' %}
    <h1>Student Records</h1>

    <table border="1">

        <tr>
            <th>Name</th>
            <th>Stack</th>
            <th>Title</th>
            <th>Description</th>
            <th>Date</th>
            <th>Hours Worked</th>
        </tr>

        {% for x in myrecords %}
        <tr>
            <td>{{ x.name }}</td>
            <td>{{ x.stack }}</td>
            <td>{{ x.title }}</td>
            <td>{{ x.description }}</td>
            <td>{{ x.date }}</td>
            <td>{{ x.hours_worked }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
